# Publish data-flow-control to PyPI.
#
# A deliberate version increase on main releases only after both test workflows pass.
# Manual dispatch uses the same gates and can retry interrupted publication.
# Uses PyPI trusted publishing (OIDC); no PYPI_API_TOKEN secret required.
name: Publish to PyPI

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Backend integration]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize all attempts; never cancel an upload partway through.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deliberate version bump and exact-SHA tests
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python scripts/release_gate.py preflight

  linux:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: 2_28
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64:latest
          - runner: ubuntu-22.04
            target: x86
            manylinux: 2_28
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: 2_28
          - runner: ubuntu-22.04
            target: armv7
            manylinux: 2_28
          - runner: ubuntu-22.04
            target: s390x
            manylinux: 2_28
          - runner: ubuntu-22.04
            target: ppc64le
            manylinux: 2_28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Host glibc on ubuntu-22.04 is too new for manylinux_2_28; build inside the image.
      # Pre-pull with retries to survive transient quay.io timeouts.
      - name: Pull manylinux image
        if: matrix.platform.manylinux_image != ''
        env:
          DOCKER_CLIENT_TIMEOUT: 300
          COMPOSE_HTTP_TIMEOUT: 300
        run: |
          image="${{ matrix.platform.manylinux_image }}"
          for attempt in 1 2 3 4 5; do
            echo "Pull attempt $attempt: $image"
            docker pull "$image" && exit 0
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi
          manylinux: ${{ matrix.platform.manylinux || '2_28' }}
          container: ${{ matrix.platform.manylinux_image }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi
          manylinux: musllinux_1_2

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  smoke-test:
    name: Installed wheel smoke test
    needs: [preflight, linux, windows, macos]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: wheels-linux-x86_64
            python: '3.10'
          - runner: ubuntu-22.04
            artifact: wheels-linux-x86_64
            python: '3.14'
          - runner: windows-latest
            artifact: wheels-windows-x64
            python: '3.13'
          - runner: macos-latest
            artifact: wheels-macos-aarch64
            python: '3.12'
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the built wheel in a fresh environment
        shell: bash
        run: |
          python -m venv wheel-test
          if [ -f wheel-test/Scripts/python.exe ]; then
            wheel_python=wheel-test/Scripts/python.exe
          else
            wheel_python=wheel-test/bin/python
          fi
          "$wheel_python" -m pip install --only-binary=:all: dist/*.whl
          "$wheel_python" -m pip check
          "$wheel_python" -I install_testing/smoke_test.py

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [preflight, linux, musllinux, windows, macos, sdist, smoke-test]
    permissions:
      actions: read
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No run-id: download only artifacts produced by this pinned-source run.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Recheck immediately before upload, after all potentially lengthy setup.
      - name: Recheck source, tests, and exact PyPI artifact hashes
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: python scripts/release_gate.py publish

      - name: Publish missing files to PyPI
        if: steps.gate.outputs.publish == 'true'
        run: uv publish --trusted-publishing always pending-dist/*

      - name: Verify complete published release
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: python scripts/release_gate.py verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: ignore
